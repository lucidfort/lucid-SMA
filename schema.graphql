type TimetablePeriod {
  endTime: String!
  id: ID!
  periodSlots: [PeriodSlot!]!
  startTime: String!
}

input TimetablePeriodInput {
  daysOfWeek: [String!]!
  endTime: String!
  startTime: String!
}

type UniqueConstraintError implements AppError & Error {
  code: String
  message: String
}