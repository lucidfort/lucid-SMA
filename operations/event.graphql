mutation CreateEvent($input: EventInput!) {
  createEvent(input: $input) {
    __typename

    ... on MutationCreateEventSuccess {
      data {
        id
      }
    }

    ... on AppError {
      __typename
      message
    }
  }
}

mutation UpdateEvent($input: EventInput!) {
  updateEvent(input: $input) {
    __typename

    ... on MutationUpdateEventSuccess {
      data {
        id
      }
    }

    ... on AppError {
      __typename
      message
    }

    ... on NotFoundError {
      __typename
      message
    }
  }
}
