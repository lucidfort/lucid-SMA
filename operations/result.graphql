mutation CreateExamResult($input: ResultInput!) {
    createExamResult(input: $input) {
        __typename

        ... on MutationCreateExamResultSuccess {
            data {
                id
            }
        }

        ... on AppError {
            __typename
            message
        }
    }
}

mutation UpdateExamResult($input: ResultInput!) {
    updateExamResult(input: $input) {
        __typename

        ... on MutationUpdateExamResultSuccess {
            data {
                id
            }
        }

        ... on AppError {
            __typename
            message
        }

        ... on NotFoundError {
            __typename
            message
        }
    }
}

