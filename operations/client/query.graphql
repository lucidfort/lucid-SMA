query GetSchoolSlug($id: ID!) {
  school(id: $id) {
    id
    slug
  }
}

query GetPrograms {
  programs {
    id
    name
  }
}

query GetGrades($where: GradeFilterInput) {
  grades(filter: $where) {
    id
    name
  }
}

query GetSubjects($teacherId: ID) {
  subjects(teacherId: $teacherId) {
    id
    name
  }
}
